<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Map of a Warming World</title><desc>Energy balance, greenhouse gases, and feedbacks</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Map of a Warming World</text><text x="82" y="145" fill="#ff8b70" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">Energy balance, greenhouse gases, and feedbacks</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><circle cx="700" cy="385" r="190" fill="#2c7fb8" stroke="#bfe9ff" stroke-width="5"/><path d="M 540 330 C 600 260, 760 240, 850 310 C 780 350, 650 365, 540 330 Z" fill="none" stroke="#69d39b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 575 450 C 660 500, 800 500, 875 420 C 790 455, 660 450, 575 450 Z" fill="none" stroke="#69d39b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="405" fill="#ffffff" font-family="Arial, sans-serif" font-size="30px" font-weight="800" text-anchor="middle">Earth</text><circle cx="170" cy="230" r="52" fill="#ffd166" stroke="none" stroke-width="2"/><text x="170" y="305" fill="#ffd166" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">Sun</text><line x1="245" y1="250" x2="490" y2="320" stroke="#ffe08a" stroke-width="6" stroke-linecap="round"/><polygon points="490.0 320.0 476.4 323.4 480.3 309.9" fill="#ffe08a"/><text x="350" y="235" fill="#ffe08a" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">shortwave in</text><line x1="1060" y1="300" x2="910" y2="350" stroke="#ff8a70" stroke-width="6" stroke-linecap="round"/><polygon points="910.0 350.0 919.3 339.5 923.7 352.8" fill="#ff8a70"/><text x="1060" y="250" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">longwave out</text><path d="M 470 230 C 650 140, 850 140, 1030 230" fill="none" stroke="#c7a6ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="750" y="150" fill="#d7c5ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">greenhouse gases</text><line x1="520" y1="520" x2="350" y2="600" stroke="#ff8b70" stroke-width="4" stroke-linecap="round"/><polygon points="350.0 600.0 358.0 588.5 364.0 601.2" fill="#ff8b70"/><text x="365" y="625" fill="#ff8b70" font-family="Arial, sans-serif" font-size="20px" font-weight="600" text-anchor="middle">ice / water feedback</text><line x1="880" y1="520" x2="1050" y2="600" stroke="#ff8b70" stroke-width="4" stroke-linecap="round"/><polygon points="1050.0 600.0 1036.0 601.2 1042.0 588.5" fill="#ff8b70"/><text x="1010" y="625" fill="#ff8b70" font-family="Arial, sans-serif" font-size="20px" font-weight="600" text-anchor="middle">feedbacks</text><text x="700" y="680" fill="#ff8b70" font-family="Arial, sans-serif" font-size="23px" font-weight="600" text-anchor="middle">energy in + energy out define the balance</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#ff8b70" stroke="none" opacity="1"/><text x="108" y="770" fill="#ff8b70" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Energy balance</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Earth receives shortwave energy</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">from the Sun and loses longwave</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">energy to space.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#ff8b70" stroke="none" opacity="1"/><text x="528" y="770" fill="#ff8b70" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Greenhouse effect</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Gases absorb and re-emit</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">infrared radiation, changing</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">how quickly heat escapes.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#ff8b70" stroke="none" opacity="1"/><text x="948" y="770" fill="#ff8b70" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Feedbacks</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Warming can strengthen some</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">responses, such as ice loss and</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">water-vapor effects, while</text><text x="948" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">other feedbacks damp change.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">Weather is an event; climate is the statistics of weather over time.</text></svg>