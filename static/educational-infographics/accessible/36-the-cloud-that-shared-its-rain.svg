<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Cloud That Shared Its Rain</title><desc>A water-cycle field guide for young observers</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Cloud That Shared Its Rain</text><text x="82" y="145" fill="#55c8f2" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">A water-cycle field guide for young observers</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><circle cx="180" cy="250" r="56" fill="#ffd166" stroke="none" stroke-width="2"/><text x="180" y="330" fill="#ffd166" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">Sun energy</text><line x1="360" y1="360" x2="560" y2="300" stroke="#63d5ff" stroke-width="4" stroke-linecap="round"/><polygon points="560.0 300.0 550.4 310.2 546.4 296.8" fill="#63d5ff"/><text x="390" y="330" fill="#9de8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">evaporation</text><circle cx="650" cy="230" r="48.3" fill="#d8e8ff" stroke="none" stroke-width="2"/><circle cx="698.3" cy="202.4" r="62.099999999999994" fill="#d8e8ff" stroke="none" stroke-width="2"/><circle cx="755.8" cy="230" r="55.199999999999996" fill="#d8e8ff" stroke="none" stroke-width="2"/><rect x="601.7" y="230" width="154.1" height="48.3" rx="20" fill="#d8e8ff" stroke="none" opacity="1"/><text x="650" y="345" fill="#d8e8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">condensation</text><line x1="790" y1="330" x2="820" y2="485" stroke="#9bcfff" stroke-width="4" stroke-linecap="round"/><polygon points="820.0 485.0 810.8 474.4 824.6 471.8" fill="#9bcfff"/><text x="845" y="410" fill="#9de8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">precipitation</text><line x1="820" y1="500" x2="820" y2="575" stroke="#7bdff8" stroke-width="5" stroke-linecap="round"/><line x1="850" y1="500" x2="850" y2="575" stroke="#7bdff8" stroke-width="5" stroke-linecap="round"/><line x1="880" y1="500" x2="880" y2="575" stroke="#7bdff8" stroke-width="5" stroke-linecap="round"/><path d="M 210 590 C 400 520, 560 640, 760 575 S 1100 540, 1260 610" fill="none" stroke="#63d5ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="655" fill="#9de8ff" font-family="Arial, sans-serif" font-size="23px" font-weight="600" text-anchor="middle">collection in rivers and soil</text><line x1="1120" y1="610" x2="1160" y2="360" stroke="#55c8f2" stroke-width="4" stroke-linecap="round"/><polygon points="1160.0 360.0 1165.0 373.1 1151.2 370.9" fill="#55c8f2"/><text x="1165" y="470" fill="#55c8f2" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">cycle continues</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#55c8f2" stroke="none" opacity="1"/><text x="108" y="770" fill="#55c8f2" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Energy in</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">The Sun warms water. Some</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">liquid becomes invisible vapor</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">and rises into the air.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#55c8f2" stroke="none" opacity="1"/><text x="528" y="770" fill="#55c8f2" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Cloud clues</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Cooler air makes vapor condense</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">into tiny droplets around dust.</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Many droplets together make a</text><text x="528" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">cloud.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#55c8f2" stroke="none" opacity="1"/><text x="948" y="770" fill="#55c8f2" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Return trip</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Drops grow, fall as rain or</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">snow, collect in rivers and</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">soil, and evaporate again.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">Observe: a cold bottle and a warm wet street show water changing state.</text></svg>