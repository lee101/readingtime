<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Seed That Trapped a Sunbeam</title><desc>How a leaf makes food for a growing plant</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Seed That Trapped a Sunbeam</text><text x="82" y="145" fill="#7bd66b" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">How a leaf makes food for a growing plant</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><circle cx="190" cy="240" r="58" fill="#ffd166" stroke="none" stroke-width="2"/><text x="190" y="330" fill="#ffd166" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">Sunlight</text><line x1="300" y1="280" x2="560" y2="330" stroke="#ffe08a" stroke-width="4" stroke-linecap="round"/><polygon points="560.0 330.0 546.8 334.6 549.4 320.8" fill="#ffe08a"/><text x="385" y="275" fill="#ffe08a" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">light energy</text><path d="M 690 260 C 530 220, 480 430, 700 500 C 900 450, 860 260, 690 260 Z" fill="#9be7b0" stroke="#2d8b68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 700 280 L 700 500" fill="5" stroke="#b5f0c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 700 360 L 590 430 M 700 390 L 820 450 M 700 330 L 800 290" fill="none" stroke="#b5f0c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="550" fill="#b5f0c0" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">chloroplasts in a leaf</text><line x1="500" y1="600" x2="620" y2="500" stroke="#63d5ff" stroke-width="4" stroke-linecap="round"/><polygon points="620.0 500.0 615.2 513.1 606.2 502.4" fill="#63d5ff"/><text x="400" y="620" fill="#9de8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">H2O from roots</text><line x1="1020" y1="420" x2="840" y2="400" stroke="#ff9c9c" stroke-width="4" stroke-linecap="round"/><polygon points="840.0 400.0 852.8 394.4 851.3 408.3" fill="#ff9c9c"/><text x="1040" y="400" fill="#ffb3b3" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">CO2 in</text><line x1="810" y1="470" x2="1010" y2="560" stroke="#f6d365" stroke-width="4" stroke-linecap="round"/><polygon points="1010.0 560.0 996.1 561.4 1001.8 548.6" fill="#f6d365"/><text x="1010" y="600" fill="#ffe08a" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">O2 out</text><rect x="650" y="600" width="100" height="48" rx="8" fill="#8b5a3c" stroke="none" opacity="1"/><text x="700" y="670" fill="#f6d365" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">sugar for growth</text><line x1="760" y1="500" x2="735" y2="600" stroke="#7bd66b" stroke-width="4" stroke-linecap="round"/><polygon points="735.0 600.0 731.1 586.5 744.7 589.9" fill="#7bd66b"/><text x="770" y="550" fill="#7bd66b" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">energy</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#7bd66b" stroke="none" opacity="1"/><text x="108" y="770" fill="#7bd66b" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Light catcher</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Chlorophyll in chloroplasts</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">absorbs light energy from the</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Sun.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#7bd66b" stroke="none" opacity="1"/><text x="528" y="770" fill="#7bd66b" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Ingredients</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Roots bring water up; stomata</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">let carbon dioxide enter the</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">leaf.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#7bd66b" stroke="none" opacity="1"/><text x="948" y="770" fill="#7bd66b" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Products</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">The plant uses energy to build</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">sugars for growth and releases</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">oxygen into the air.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">The leaf is a tiny energy factory, not a solar panel made of metal.</text></svg>