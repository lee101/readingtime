<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Magnet with Two Moods</title><desc>A field guide to poles, fields, and electromagnets</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Magnet with Two Moods</text><text x="82" y="145" fill="#d88bff" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">A field guide to poles, fields, and electromagnets</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><rect x="470" y="270" width="250" height="105" rx="18" fill="#d85c7a" stroke="none" opacity="1"/><rect x="720" y="270" width="250" height="105" rx="18" fill="#5c8fe0" stroke="none" opacity="1"/><text x="535" y="338" fill="#ffffff" font-family="Arial, sans-serif" font-size="44px" font-weight="800" text-anchor="middle">N</text><text x="905" y="338" fill="#ffffff" font-family="Arial, sans-serif" font-size="44px" font-weight="800" text-anchor="middle">S</text><path d="M 480 270 C 300 120, 1100 120, 960 270" fill="none" stroke="#d88bff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 500 375 C 320 550, 1030 550, 900 375" fill="none" stroke="#d88bff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="710" y="155" fill="#e7c8ff" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">magnetic field lines</text><line x1="420" y1="470" x2="570" y2="360" stroke="#ff9c9c" stroke-width="4" stroke-linecap="round"/><polygon points="570.0 360.0 564.4 372.8 556.1 361.5" fill="#ff9c9c"/><text x="350" y="500" fill="#ffb3b3" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">unlike poles attract</text><line x1="1000" y1="470" x2="850" y2="360" stroke="#9bcfff" stroke-width="4" stroke-linecap="round"/><polygon points="850.0 360.0 863.9 361.5 855.6 372.8" fill="#9bcfff"/><text x="1010" y="500" fill="#9de8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">like poles repel</text><rect x="270" y="600" width="210" height="70" rx="8" fill="#8d9aaa" stroke="none" opacity="1"/><text x="375" y="645" fill="#ffffff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">iron filings</text><line x1="300" y1="680" x2="450" y2="680" stroke="#d88bff" stroke-width="3" stroke-linecap="round"/><line x1="325" y1="710" x2="425" y2="710" stroke="#d88bff" stroke-width="3" stroke-linecap="round"/><line x1="350" y1="740" x2="400" y2="740" stroke="#d88bff" stroke-width="3" stroke-linecap="round"/><text x="1010" y="650" fill="#d7c5ff" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">coil + current</text><path d="M 940 575 C 1030 540, 1130 575, 1200 540" fill="none" stroke="#d88bff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 950 600 C 1040 565, 1140 600, 1210 565" fill="none" stroke="#d88bff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#d88bff" stroke="none" opacity="1"/><text x="108" y="770" fill="#d88bff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Two poles</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">A bar magnet has north and</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">south poles. Opposite poles</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">attract; like poles repel.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#d88bff" stroke="none" opacity="1"/><text x="528" y="770" fill="#d88bff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Invisible pattern</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">The magnetic field surrounds</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">the magnet. Iron filings trace</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">its direction.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#d88bff" stroke="none" opacity="1"/><text x="948" y="770" fill="#d88bff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Coil trick</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Electric current through a coil</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">creates a magnetic field; a</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">soft core can strengthen an</text><text x="948" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">electromagnet.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">A magnet does not pull every object equally: iron responds strongly; plastic does not.</text></svg>