<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Earthquake Beneath the Mountain</title><desc>Faults, stored stress, seismic waves, and safer towns</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Earthquake Beneath the Mountain</text><text x="82" y="145" fill="#f28b55" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">Faults, stored stress, seismic waves, and safer towns</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><path d="M 180 270 L 650 220 L 700 500 L 230 540 Z" fill="#d9e2ef" stroke="#7b91b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 700 220 L 1190 280 L 1150 520 L 700 500 Z" fill="#f0c1a0" stroke="#9b6d58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 700 500 C 600 590, 540 610, 430 650" fill="none" stroke="#f28b55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 700 500 C 820 590, 900 610, 1010 650" fill="none" stroke="#f28b55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><line x1="700" y1="220" x2="700" y2="500" stroke="#ff8a70" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 10"/><text x="700" y="575" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="middle">fault</text><line x1="500" y1="180" x2="500" y2="270" stroke="#ff8a70" stroke-width="6" stroke-linecap="round"/><polygon points="500.0 270.0 493.0 257.9 507.0 257.9" fill="#ff8a70"/><text x="500" y="155" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">plate motion</text><line x1="900" y1="180" x2="900" y2="280" stroke="#ff8a70" stroke-width="6" stroke-linecap="round"/><polygon points="900.0 280.0 893.0 267.9 907.0 267.9" fill="#ff8a70"/><text x="900" y="155" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">plate motion</text><circle cx="700" cy="400" r="18" fill="#ff8a70" stroke="none" stroke-width="2"/><text x="700" y="370" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">stress</text><path d="M 700 400 C 620 340, 470 350, 300 280" fill="none" stroke="#f6d365" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 700 400 C 780 340, 930 350, 1100 280" fill="none" stroke="#f6d365" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="680" fill="#f28b55" font-family="Arial, sans-serif" font-size="23px" font-weight="600" text-anchor="middle">sudden slip sends seismic waves through the crust</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#f28b55" stroke="none" opacity="1"/><text x="108" y="770" fill="#f28b55" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Moving plates</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Earth’s outer shell is broken</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">into plates that move slowly on</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">the mantle beneath them.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#f28b55" stroke="none" opacity="1"/><text x="528" y="770" fill="#f28b55" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Sudden slip</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Rock can lock while stress</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">builds; an earthquake happens</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">when a fault slips and waves</text><text x="528" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">spread.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#f28b55" stroke="none" opacity="1"/><text x="948" y="770" fill="#f28b55" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Safety</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Building design, early warning,</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">and prepared communities reduce</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">risk even when timing is</text><text x="948" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">uncertain.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">Magnitude describes energy released; intensity describes how shaking feels at a place.</text></svg>