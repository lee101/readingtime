<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Edge of the Black Hole</title><desc>Event horizons, curved spacetime, and an outside observer</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Edge of the Black Hole</text><text x="82" y="145" fill="#b68cff" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">Event horizons, curved spacetime, and an outside observer</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><circle cx="700" cy="365" r="178" fill="#090b16" stroke="#b68cff" stroke-width="6"/><circle cx="700" cy="365" r="220" fill="none" stroke="#7bd66b" stroke-width="3"/><path d="M 450 365 C 520 230, 880 230, 950 365 C 880 500, 520 500, 450 365 Z" fill="none" stroke="#ff8a70" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M 450 365 C 520 300, 880 300, 950 365" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="375" fill="#ffffff" font-family="Arial, sans-serif" font-size="30px" font-weight="800" text-anchor="middle">black hole</text><text x="700" y="150" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">accretion disk</text><text x="700" y="600" fill="#b5f0c0" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">event horizon: boundary, not a solid wall</text><line x1="350" y1="250" x2="480" y2="320" stroke="#9de8ff" stroke-width="5" stroke-linecap="round"/><polygon points="480.0 320.0 466.0 320.4 472.6 308.1" fill="#9de8ff"/><text x="300" y="220" fill="#9de8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">infalling matter</text><line x1="1100" y1="250" x2="930" y2="320" stroke="#9de8ff" stroke-width="5" stroke-linecap="round"/><polygon points="930.0 320.0 938.5 308.9 943.9 321.9" fill="#9de8ff"/><text x="1130" y="220" fill="#9de8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">light from outside</text><text x="700" y="680" fill="#b68cff" font-family="Arial, sans-serif" font-size="23px" font-weight="600" text-anchor="middle">gravity curves paths and clocks near the boundary</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#b68cff" stroke="none" opacity="1"/><text x="108" y="770" fill="#b68cff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Event horizon</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">The horizon is a boundary in</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">spacetime, not a solid wall.</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Escape velocity at the horizon</text><text x="108" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">is the speed of light.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#b68cff" stroke="none" opacity="1"/><text x="528" y="770" fill="#b68cff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Curved space</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Mass curves spacetime. Near a</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">black hole, clocks and paths</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">depend on gravity and motion.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#b68cff" stroke="none" opacity="1"/><text x="948" y="770" fill="#b68cff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Light from outside</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">An outside observer can receive</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">light from matter before it</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">crosses the horizon, even</text><text x="948" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">though nothing escapes from</text><text x="948" y="918" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">inside.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">A stellar-mass black hole can form when a massive star’s core collapses after its fuel is gone.</text></svg>