<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Machine That Learned from Mistakes</title><desc>A practical map of a prediction model</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Machine That Learned from Mistakes</text><text x="82" y="145" fill="#a58bff" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">A practical map of a prediction model</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="260" x2="625" y2="210" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="260" x2="625" y2="320" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="260" x2="625" y2="430" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="260" x2="625" y2="540" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="370" x2="625" y2="210" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="370" x2="625" y2="320" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="370" x2="625" y2="430" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="370" x2="625" y2="540" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="480" x2="625" y2="210" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="480" x2="625" y2="320" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="480" x2="625" y2="430" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="480" x2="625" y2="540" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="675" y1="210" x2="975" y2="300" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="675" y1="210" x2="975" y2="430" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="675" y1="320" x2="975" y2="300" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="675" y1="320" x2="975" y2="430" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="675" y1="430" x2="975" y2="300" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="675" y1="430" x2="975" y2="430" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="675" y1="540" x2="975" y2="300" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><line x1="675" y1="540" x2="975" y2="430" stroke="#56658a" stroke-width="2" stroke-linecap="round"/><circle cx="300" cy="260" r="25" fill="#a58bff" stroke="#ffffff" stroke-width="3"/><circle cx="300" cy="370" r="25" fill="#a58bff" stroke="#ffffff" stroke-width="3"/><circle cx="300" cy="480" r="25" fill="#a58bff" stroke="#ffffff" stroke-width="3"/><circle cx="650" cy="210" r="25" fill="#a58bff" stroke="#ffffff" stroke-width="3"/><circle cx="650" cy="320" r="25" fill="#a58bff" stroke="#ffffff" stroke-width="3"/><circle cx="650" cy="430" r="25" fill="#a58bff" stroke="#ffffff" stroke-width="3"/><circle cx="650" cy="540" r="25" fill="#a58bff" stroke="#ffffff" stroke-width="3"/><circle cx="1000" cy="300" r="25" fill="#a58bff" stroke="#ffffff" stroke-width="3"/><circle cx="1000" cy="430" r="25" fill="#a58bff" stroke="#ffffff" stroke-width="3"/><text x="300" y="620" fill="#a58bff" font-family="Arial, sans-serif" font-size="23px" font-weight="700" text-anchor="middle">inputs</text><text x="650" y="620" fill="#a58bff" font-family="Arial, sans-serif" font-size="23px" font-weight="700" text-anchor="middle">weighted connections</text><text x="1000" y="620" fill="#a58bff" font-family="Arial, sans-serif" font-size="23px" font-weight="700" text-anchor="middle">prediction</text><line x1="300" y1="180" x2="650" y2="180" stroke="#9de8ff" stroke-width="4" stroke-linecap="round"/><polygon points="650.0 180.0 637.9 187.0 637.9 173.0" fill="#9de8ff"/><text x="475" y="155" fill="#9de8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">features</text><line x1="650" y1="180" x2="1000" y2="180" stroke="#9de8ff" stroke-width="4" stroke-linecap="round"/><polygon points="1000.0 180.0 987.9 187.0 987.9 173.0" fill="#9de8ff"/><text x="825" y="155" fill="#9de8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">activation</text><text x="700" y="680" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="23px" font-weight="600" text-anchor="middle">loss -&gt; backpropagation -&gt; updated weights</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#a58bff" stroke="none" opacity="1"/><text x="108" y="770" fill="#a58bff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Inputs</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">A model begins with measurable</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">features, such as temperature,</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">wind, and pressure.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#a58bff" stroke="none" opacity="1"/><text x="528" y="770" fill="#a58bff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Weights</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Connections combine inputs with</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">adjustable weights; activation</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">functions pass signals onward.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#a58bff" stroke="none" opacity="1"/><text x="948" y="770" fill="#a58bff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Learning loop</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Prediction is compared with the</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">target, loss measures error,</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">and backpropagation adjusts</text><text x="948" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">weights.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">Training data, model choice, and human oversight determine whether a forecast is useful.</text></svg>