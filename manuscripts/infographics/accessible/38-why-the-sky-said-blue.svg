<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>Why the Sky Said Blue</title><desc>Light, air, and the color that reaches your eyes</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">Why the Sky Said Blue</text><text x="82" y="145" fill="#6fa8ff" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">Light, air, and the color that reaches your eyes</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><circle cx="180" cy="260" r="55" fill="#ffd166" stroke="none" stroke-width="2"/><text x="180" y="340" fill="#ffd166" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">white sunlight</text><line x1="235" y1="260" x2="1160" y2="260" stroke="#fff2b0" stroke-width="4" stroke-linecap="round"/><text x="560" y="220" fill="#fff2b0" font-family="Arial, sans-serif" font-size="21px" font-weight="500" text-anchor="start">incoming wavelengths</text><circle cx="620" cy="260" r="13" fill="#ffffff" stroke="none" stroke-width="2"/><circle cx="680" cy="260" r="10" fill="#ffffff" stroke="none" stroke-width="2"/><circle cx="740" cy="260" r="16" fill="#ffffff" stroke="none" stroke-width="2"/><circle cx="800" cy="260" r="11" fill="#ffffff" stroke="none" stroke-width="2"/><text x="710" y="330" fill="#d8e8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">air molecules scatter light</text><line x1="680" y1="275" x2="480" y2="500" stroke="#6fa8ff" stroke-width="5" stroke-linecap="round"/><polygon points="480.0 500.0 482.8 486.3 493.3 495.6" fill="#6fa8ff"/><line x1="760" y1="275" x2="830" y2="500" stroke="#ff8a70" stroke-width="5" stroke-linecap="round"/><polygon points="830.0 500.0 819.7 490.5 833.1 486.3" fill="#ff8a70"/><line x1="820" y1="275" x2="1110" y2="500" stroke="#6fa8ff" stroke-width="5" stroke-linecap="round"/><polygon points="1110.0 500.0 1096.1 498.1 1104.7 487.0" fill="#6fa8ff"/><text x="410" y="555" fill="#9bcfff" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">blue reaches eyes</text><text x="830" y="555" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">red/orange continues</text><text x="1130" y="555" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">more path at sunset</text><path d="M 250 610 C 480 520, 780 640, 1190 545" fill="none" stroke="#6fa8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="650" fill="#6fa8ff" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">our atmosphere redirects sunlight</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#6fa8ff" stroke="none" opacity="1"/><text x="108" y="770" fill="#6fa8ff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Tiny particles</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Air is made of molecules much</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">smaller than the wavelength of</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">visible light.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#6fa8ff" stroke="none" opacity="1"/><text x="528" y="770" fill="#6fa8ff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Scattering</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Short blue wavelengths scatter</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">in many directions more</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">strongly than longer red</text><text x="528" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">wavelengths.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#6fa8ff" stroke="none" opacity="1"/><text x="948" y="770" fill="#6fa8ff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Sunset clue</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">At sunset, light travels a</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">longer path through air, so</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">more red and orange reaches us.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">The sky is blue because our atmosphere redirects sunlight toward our eyes.</text></svg>