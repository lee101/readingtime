<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Forest That Shared Its Meals</title><desc>Energy flow and nutrient cycling in a food web</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Forest That Shared Its Meals</text><text x="82" y="145" fill="#69d39b" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">Energy flow and nutrient cycling in a food web</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><circle cx="180" cy="220" r="48" fill="#ffd166" stroke="none" stroke-width="2"/><text x="180" y="290" fill="#ffd166" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">Sun</text><rect x="520" y="270" width="90" height="170" rx="12" fill="#855b3d" stroke="none" opacity="1"/><circle cx="565" cy="240" r="105" fill="#4f9d61" stroke="none" stroke-width="2"/><text x="565" y="465" fill="#b5f0c0" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">producer</text><circle cx="850" cy="350" r="54" fill="#c99562" stroke="none" stroke-width="2"/><text x="850" y="455" fill="#f2c89b" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">herbivore</text><circle cx="1120" cy="235" r="64" fill="#a96b54" stroke="none" stroke-width="2"/><text x="1120" y="325" fill="#f2b39b" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">predator</text><rect x="875" y="545" width="210" height="35" rx="16" fill="#8b5a3c" stroke="none" opacity="1"/><text x="980" y="625" fill="#e4c09b" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">decomposer</text><line x1="250" y1="270" x2="450" y2="310" stroke="#9de8ff" stroke-width="4" stroke-linecap="round"/><polygon points="450.0 310.0 436.7 314.5 439.5 300.8" fill="#9de8ff"/><text x="340" y="245" fill="#9de8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">energy</text><line x1="650" y1="350" x2="790" y2="350" stroke="#69d39b" stroke-width="4" stroke-linecap="round"/><polygon points="790.0 350.0 777.9 357.0 777.9 343.0" fill="#69d39b"/><text x="720" y="330" fill="#69d39b" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">eats</text><line x1="910" y1="315" x2="1050" y2="260" stroke="#69d39b" stroke-width="4" stroke-linecap="round"/><polygon points="1050.0 260.0 1041.3 270.9 1036.2 257.9" fill="#69d39b"/><text x="980" y="285" fill="#69d39b" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">eats</text><line x1="900" y1="430" x2="1000" y2="530" stroke="#c7a6ff" stroke-width="4" stroke-linecap="round"/><polygon points="1000.0 530.0 986.5 526.4 996.4 516.5" fill="#c7a6ff"/><text x="960" y="495" fill="#d7c5ff" font-family="Arial, sans-serif" font-size="20px" font-weight="600" text-anchor="middle">dead matter</text><line x1="800" y1="560" x2="620" y2="440" stroke="#c7a6ff" stroke-width="4" stroke-linecap="round"/><polygon points="620.0 440.0 634.0 440.9 626.2 452.5" fill="#c7a6ff"/><text x="710" y="555" fill="#d7c5ff" font-family="Arial, sans-serif" font-size="20px" font-weight="600" text-anchor="middle">nutrients return</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#69d39b" stroke="none" opacity="1"/><text x="108" y="770" fill="#69d39b" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Energy flows one way</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Sunlight enters through</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">producers; energy is spent at</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">each feeding step.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#69d39b" stroke="none" opacity="1"/><text x="528" y="770" fill="#69d39b" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Many connections</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Food webs link several food</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">chains. A species can be both</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">predator and prey.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#69d39b" stroke="none" opacity="1"/><text x="948" y="770" fill="#69d39b" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Nature&#x27;s recyclers</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Decomposers return nutrients</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">from dead matter to soil, where</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">producers can use them again.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">Removing one species can change every relationship around it.</text></svg>