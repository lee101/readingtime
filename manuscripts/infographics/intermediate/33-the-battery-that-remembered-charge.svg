<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Battery That Remembered Charge</title><desc>Electrons, ions, and stored chemical energy</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Battery That Remembered Charge</text><text x="82" y="145" fill="#63d5ff" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">Electrons, ions, and stored chemical energy</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><rect x="300" y="250" width="120" height="300" rx="12" fill="#d66a6a" stroke="none" opacity="1"/><rect x="980" y="250" width="120" height="300" rx="12" fill="#6aa7d6" stroke="none" opacity="1"/><text x="360" y="435" fill="#ffffff" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">anode</text><text x="1040" y="435" fill="#ffffff" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">cathode</text><rect x="420" y="250" width="560" height="300" rx="4" fill="#233a59" stroke="#6f9ac4" opacity="0.18"/><text x="700" y="400" fill="#bfe9ff" font-family="Arial, sans-serif" font-size="24px" font-weight="600" text-anchor="middle">electrolyte</text><path d="M 420 320 C 570 270, 830 370, 980 320" fill="none" stroke="#8ed8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="290" fill="#bfe9ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">ion path</text><line x1="360" y1="250" x2="360" y2="170" stroke="#d8e8ff" stroke-width="5" stroke-linecap="round"/><line x1="1040" y1="250" x2="1040" y2="170" stroke="#d8e8ff" stroke-width="5" stroke-linecap="round"/><line x1="360" y1="170" x2="1040" y2="170" stroke="#d8e8ff" stroke-width="5" stroke-linecap="round"/><rect x="610" y="125" width="180" height="90" rx="12" fill="#f0b54b" stroke="none" opacity="1"/><text x="700" y="180" fill="#3b2b0c" font-family="Arial, sans-serif" font-size="27px" font-weight="800" text-anchor="middle">load</text><line x1="370" y1="160" x2="610" y2="160" stroke="#f6d365" stroke-width="4" stroke-linecap="round"/><polygon points="610.0 160.0 597.9 167.0 597.9 153.0" fill="#f6d365"/><text x="490" y="125" fill="#ffe08a" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">electrons</text><line x1="790" y1="160" x2="1030" y2="160" stroke="#f6d365" stroke-width="4" stroke-linecap="round"/><polygon points="1030.0 160.0 1017.9 167.0 1017.9 153.0" fill="#f6d365"/><text x="910" y="125" fill="#ffe08a" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">electrons</text><text x="700" y="650" fill="#63d5ff" font-family="Arial, sans-serif" font-size="23px" font-weight="600" text-anchor="middle">oxidation + reduction release chemical energy</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#63d5ff" stroke="none" opacity="1"/><text x="108" y="770" fill="#63d5ff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Chemical change</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">A battery stores chemical</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">energy in reactions that</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">separate charge inside its</text><text x="108" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">electrodes.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#63d5ff" stroke="none" opacity="1"/><text x="528" y="770" fill="#63d5ff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Two paths</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Electrons move through the</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">external wire; ions move</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">through the electrolyte to keep</text><text x="528" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">charge balanced.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#63d5ff" stroke="none" opacity="1"/><text x="948" y="770" fill="#63d5ff" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Recharge</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">A charger drives a reverse</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">reaction, moving chemicals back</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">toward their charged state.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">A battery stores chemical potential, not a pile of electrons waiting inside it.</text></svg>