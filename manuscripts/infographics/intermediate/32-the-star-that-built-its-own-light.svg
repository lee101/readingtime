<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Star That Built Its Own Light</title><desc>A stellar core, a long wait, and light escaping</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Star That Built Its Own Light</text><text x="82" y="145" fill="#ffc857" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">A stellar core, a long wait, and light escaping</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><circle cx="700" cy="365" r="190" fill="#f29f05" stroke="#ffe08a" stroke-width="5"/><circle cx="700" cy="365" r="125" fill="#ffb52e" stroke="none" stroke-width="2"/><circle cx="700" cy="365" r="58" fill="#fff0a6" stroke="none" stroke-width="2"/><text x="700" y="375" fill="#7a4b00" font-family="Arial, sans-serif" font-size="25px" font-weight="800" text-anchor="middle">core</text><line x1="540" y1="230" x2="640" y2="315" stroke="#fff0a6" stroke-width="5" stroke-linecap="round"/><polygon points="640.0 315.0 626.2 312.5 635.3 301.8" fill="#fff0a6"/><line x1="860" y1="230" x2="760" y2="315" stroke="#fff0a6" stroke-width="5" stroke-linecap="round"/><polygon points="760.0 315.0 764.7 301.8 773.8 312.5" fill="#fff0a6"/><line x1="700" y1="160" x2="700" y2="270" stroke="#fff0a6" stroke-width="5" stroke-linecap="round"/><polygon points="700.0 270.0 693.0 257.9 707.0 257.9" fill="#fff0a6"/><text x="700" y="115" fill="#ffe08a" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">gravity pulls inward</text><line x1="530" y1="500" x2="640" y2="420" stroke="#ff8a70" stroke-width="5" stroke-linecap="round"/><polygon points="640.0 420.0 634.3 432.8 626.1 421.5" fill="#ff8a70"/><line x1="870" y1="500" x2="760" y2="420" stroke="#ff8a70" stroke-width="5" stroke-linecap="round"/><polygon points="760.0 420.0 773.9 421.5 765.7 432.8" fill="#ff8a70"/><text x="700" y="590" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">gas pressure pushes outward</text><path d="M 700 365 C 760 250, 900 240, 930 120" fill="none" stroke="#fff2b0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 700 365 C 640 250, 500 240, 470 120" fill="none" stroke="#fff2b0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="85" fill="#fff2b0" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">energy diffuses; photons re-emitted</text><text x="700" y="680" fill="#ffc857" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">fusion: hydrogen -&gt; helium + energy</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#ffc857" stroke="none" opacity="1"/><text x="108" y="770" fill="#ffc857" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Core furnace</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">In a star’s core, hydrogen</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">fusion releases energy when</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">gravity compresses the gas.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#ffc857" stroke="none" opacity="1"/><text x="528" y="770" fill="#ffc857" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Balanced star</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Gravity pulls inward while</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">pressure from hot gas pushes</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">outward; the balance lasts a</text><text x="528" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">long time.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#ffc857" stroke="none" opacity="1"/><text x="948" y="770" fill="#ffc857" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Ancient light</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Energy from the core takes a</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">long time to diffuse outward;</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">light is emitted after many</text><text x="948" y="891" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">absorptions and re-emissions.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">A star is powered by nuclear fusion, not by ordinary fire.</text></svg>