<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><title>The Bridge That Counted Forces</title><desc>How loads travel through a structure</desc><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#0b1220" stroke="none" opacity="1"/><rect x="40" y="40" width="1320" height="920" rx="24" fill="#0f192b" stroke="#263754" opacity="1"/><text x="80" y="105" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="42px" font-weight="800" text-anchor="start">The Bridge That Counted Forces</text><text x="82" y="145" fill="#ffb454" font-family="Arial, sans-serif" font-size="23px" font-weight="500" text-anchor="start">How loads travel through a structure</text><line x1="80" y1="170" x2="1320" y2="170" stroke="#263754" stroke-width="2" stroke-linecap="round"/><line x1="160" y1="520" x2="1240" y2="520" stroke="#d9e2ef" stroke-width="18" stroke-linecap="round"/><line x1="160" y1="610" x2="1240" y2="610" stroke="#6c7b91" stroke-width="10" stroke-linecap="round"/><path d="M 260 520 L 350 350 L 440 520 M 440 520 L 530 350 L 620 520 M 620 520 L 710 350 L 800 520 M 800 520 L 890 350 L 980 520 M 980 520 L 1070 350 L 1160 520" fill="none" stroke="#ffb454" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><line x1="160" y1="610" x2="260" y2="520" stroke="#9aa8bc" stroke-width="10" stroke-linecap="round"/><line x1="1160" y1="520" x2="1240" y2="610" stroke="#9aa8bc" stroke-width="10" stroke-linecap="round"/><line x1="700" y1="190" x2="700" y2="320" stroke="#ff8a70" stroke-width="7" stroke-linecap="round"/><polygon points="700.0 320.0 693.0 307.9 707.0 307.9" fill="#ff8a70"/><text x="700" y="170" fill="#ffb3a7" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="middle">load</text><line x1="420" y1="300" x2="350" y2="270" stroke="#9de8ff" stroke-width="4" stroke-linecap="round"/><polygon points="350.0 270.0 363.9 268.3 358.4 281.2" fill="#9de8ff"/><text x="315" y="250" fill="#9de8ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">tension</text><line x1="980" y1="300" x2="1050" y2="270" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/><polygon points="1050.0 270.0 1041.6 281.2 1036.1 268.3" fill="#ffd166"/><text x="1060" y="250" fill="#ffe08a" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">compression</text><line x1="350" y1="540" x2="280" y2="590" stroke="#c7a6ff" stroke-width="4" stroke-linecap="round"/><polygon points="280.0 590.0 285.8 577.3 293.9 588.6" fill="#c7a6ff"/><text x="260" y="650" fill="#d7c5ff" font-family="Arial, sans-serif" font-size="21px" font-weight="600" text-anchor="middle">reaction</text><text x="700" y="690" fill="#ffb454" font-family="Arial, sans-serif" font-size="22px" font-weight="600" text-anchor="middle">triangles keep the frame from racking</text><rect x="80" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="80" y="715" width="400" height="8" rx="4" fill="#ffb454" stroke="none" opacity="1"/><text x="108" y="770" fill="#ffb454" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Load path</text><text x="108" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Weight enters the deck, moves</text><text x="108" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">through beams and supports,</text><text x="108" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">then reaches the ground.</text><rect x="500" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="500" y="715" width="400" height="8" rx="4" fill="#ffb454" stroke="none" opacity="1"/><text x="528" y="770" fill="#ffb454" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Push and pull</text><text x="528" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Tension stretches members;</text><text x="528" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">compression squeezes them;</text><text x="528" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">bending makes a beam curve.</text><rect x="920" y="715" width="400" height="205" rx="16" fill="#131e32" stroke="#2c3d5e" opacity="1"/><rect x="920" y="715" width="400" height="8" rx="4" fill="#ffb454" stroke="none" opacity="1"/><text x="948" y="770" fill="#ffb454" font-family="Arial, sans-serif" font-size="25px" font-weight="700" text-anchor="start">Stable shapes</text><text x="948" y="810" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">Triangles resist changing</text><text x="948" y="837" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">shape, so trusses can span gaps</text><text x="948" y="864" fill="#d6e0f0" font-family="Arial, sans-serif" font-size="20px" font-weight="400" text-anchor="start">with many small members.</text><text x="80" y="965" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="20px" font-weight="500" text-anchor="start">A fair bridge test measures deflection and failure, not just whether it survives one load.</text></svg>